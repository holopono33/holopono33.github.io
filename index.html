<title>国旗クイズ / FLAG QUIZ</title>

<body>
<div id="loadingScreen">
  <p>初回準備中... / Loading...</p>
</div>
<!-- 🏠 ホーム面 -->
<div id="homeScreen" class="homeMenu">
<h1>🌍 FLAG QUIZ<BR>-世界196カ国 国旗クイズ-</h1>

  <div class="menuGroup">
  <button class="normal-btn" onclick="startNormal()">
    <span class="mode-title">▶ 通常モード / Normal mode</span>
    <span class="mode-subtext">全196か国から出題 / All 196 countries</span>
  </button>

  <!-- 🌎 大陸モードボタン -->
<button class="continent-btn" onclick="openContinentModal()">
  <span class="mode-title">🌎 大陸別モード / Continent mode</span>
  <span class="mode-subtext">選んだ大陸から出題 / Quiz by continent</span>
</button>

<!-- 🌎 モーダル -->
<div id="continentModal" class="modal hidden" onclick="closeContinentModal(event)">
  <div class="modalContent">

    <h4>🌎 大陸を選ぶ / Select a continent</h4>

    <select id="continentSelect" onchange="startContinentFromSelect()">
      <option value="">選択してください / Choose one</option>
      <option value="asia">アジア / Asia</option>
      <option value="europe">ヨーロッパ / Europe</option>
      <option value="africa">アフリカ / Africa</option>
      <option value="northamerica">北米 / North America</option>
      <option value="southamerica">南米 / South America</option>
      <option value="oceania">オセアニア / Oceania</option>
    </select>

    <button class="modalCloseBtn" onclick="closeContinentModal()">
     × 閉じる / Close
    </button>
    </div>
</div>
  <button class="review-btn" onclick="startReview()">
    <span class="mode-title">🔁 復習モード / Review mode</span>
    <span class="mode-subtext">間違えた国を復習 / Review missed flags</span>
  </button>

  <button class="challenge-btn" onclick="startTimeAttack()">
    <span class="mode-title">🏆 1分チャレンジ / 1-minute challenge</span>
    <!-- <span class="mode-subtext">1分で何問解けるか挑戦 / Solve as many as you can in 1 minute</span>-->
  </button>
</div>

<div id="timeAttackResult" class="timeResultBox">
  <h3>🏆 チャレンジ記録 /challenge record</h3>
  <p>今回 / Score: <span id="currentScore">-</span></p>
  <p>最高スコア / High score: <span id="taHighScore">0</span></p>
  <p style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:0;">
  <span>ランク / Rank: <span id="taRank">-</span></span>
  <span>順位 / Place: <span id="taRanking">-</span></span>
</p>
</div>
</div>

<!-- 🎮 ゲーム画面 -->
<div id="gameScreen" style="display:none;">
<div class="app">
<div class="topbar">
<div>Score:<span id="score">0</span></div>
<div>Continue:<span id="combo">0</span></div>
<div class="timer">⏱<span id="time">10</span></div>
<div>Review:<span id="reviewCount">0</span></div>
<div>🏆:<span id="highScore">0</span></div>
</div>
  <button onclick="goHome()">← ホームに戻る / Back to Home</button>
  <h2 id="modeTitle"></h2>
  <div>正答率 / Accuracy rate: <span id="accuracy">0</span>%</div>
  <div class="flagWrap">
  <img id="flag">
 </div>
  <p id="result"></p>
  <input type="text" id="answer" placeholder="国名を入力/country name here">
  <button class="word" onclick="checkAnswer()">答える / Answer</button>
  <button class="skip" onclick="skipQuestion()">次へ / Skip</button>
  <button id="pauseBtn" class="pause" onclick="togglePause()">⏸ 停止 / Pause</button>

</div></div>
